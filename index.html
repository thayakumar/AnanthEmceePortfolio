<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0f1112" />
<title data-hydrate="meta.site_title">Ananth — Emcee. Host. Storyteller.</title>
<meta name="description" data-hydrate="meta.description" content="Ananth is a multilingual emcee (Bahasa Malaysia · English · Tamil) hosting stages across Malaysia — from campus fests and gala dinners to government ceremonies." />
<link rel="icon" type="image/jpeg" href="assets/images/favicon.jpg" />
<link rel="apple-touch-icon" href="assets/images/favicon.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Permanent+Marker&family=Anton&family=Bebas+Neue&family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600&family=Noto+Sans+Tamil:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="chalkboard">

<!-- Background music (muted until first interaction — see main.js) -->
<audio id="bgMusic" src="assets/audio/intro.mp3" loop preload="auto" playsinline></audio>

<!-- Music toggle -->
<button id="musicToggle" class="music-toggle" aria-label="toggle music" title="music">
  <svg class="music-toggle__on"  viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zM16 8a5 5 0 0 1 0 8M18.5 5.5a9 9 0 0 1 0 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <svg class="music-toggle__off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zM17 9l5 5m0-5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>

<!-- Chalk dust canvas -->
<canvas id="dust" aria-hidden="true"></canvas>

<!-- Custom cursor -->
<div class="cursor" id="cursor" aria-hidden="true">
  <span class="cursor__ring"></span>
  <span class="cursor__dot"></span>
</div>

<!-- Loader -->
<div class="loader" id="loader" role="button" tabindex="0" aria-label="Enter site">
  <svg viewBox="0 0 800 240" class="loader__svg" preserveAspectRatio="xMidYMid meet">
    <text x="400" y="160" text-anchor="middle" class="loader__text">ANANTH</text>
  </svg>
  <span class="loader__sub">click anywhere to enter</span>
</div>

<!-- Navigation -->
<header class="nav" id="nav" data-render="nav"></header>

<!-- Hero -->
<section class="hero" id="top" data-render="hero"></section>

<!-- Marquee band -->
<div class="marquee" aria-hidden="true" data-render="marquee"></div>

<!-- About -->
<section class="about" id="about" data-render="about"></section>

<!-- Stages / Experience -->
<section class="stages" id="stages" data-render="stages"></section>

<!-- Clients marquee -->
<section class="clients" id="clients" data-render="clients"></section>

<!-- Gallery -->
<section class="gallery" id="gallery" data-render="gallery"></section>

<!-- Voices -->
<section class="voices" id="voices" data-render="voices"></section>

<!-- Book -->
<section class="book" id="book" data-render="book"></section>


<!-- Lightbox -->
<div class="lightbox" id="lightbox" aria-hidden="true">
  <button class="lightbox__close" id="lbClose" aria-label="close">×</button>
  <img id="lbImg" alt="" />
  <div id="lbCap" class="lightbox__cap"></div>
</div>

<script src="assets/js/render.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
